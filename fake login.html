<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nukacola-login.com</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    
    
    
    <h1 class="fakelogin1">login</h1>
    <br>
    <h2 class="home"> <a href="index.html">home </a></h2>
    
    <form onsubmit="checkCredentials(event)">
       <div>

    <label for="username">Username</label>
    <input type="text" name="username" id="username" placeholder="hint = from nukacola.com" required> 

</div>

<br>

    <div>

    <label for="pswd">enter password</label>
    <input type="text" name="pswd" id="pswd" placeholder="hint = password" required>

</div>

<br>

<div>
<input type="reset">
</div>
</div>

<br>

<div>
<input type="submit">
</div>
</form>

<script>
        function checkCredentials(event) {
            event.preventDefault();
            
            
            var correctUsername = "admin";
            var correctPassword = "password";
            
            var userEntered = document.getElementById("username").value;
            var passwordEntered = document.getElementById("pswd").value;
            
            
            if (userEntered === correctUsername && passwordEntered === correctPassword) {
                window.location.href = "welcome.html";
            } else {
                alert("Incorrect username or password. Please try again.");
            }
        }
    </script>
</body>
</html>
